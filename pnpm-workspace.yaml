packages:
  - 'apps/*'
  - 'packages/*'
  - 'services/*'
  - 'e2e'

# React Native tooling (Metro, CocoaPods and Gradle autolinking) expects a flat node_modules.
nodeLinker: hoisted

allowBuilds:
  esbuild: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - lucide-react@1.49.0

# The RN CLI plugin's optional peer resolved to 0.87.1; keep it on the SDK 57 React Native line.
overrides:
  '@react-native/metro-config': 0.86.3
