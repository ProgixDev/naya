# Minimum gate for every pull request and every push to master: frozen install, typecheck, unit tests,
# lint and the admin build. The Playwright suite is a separate manual job (Actions → CI → Run workflow)
# because it starts the demo API, both Expo web apps and the admin (see e2e/playwright.config.ts).
# pnpm 12 forwards a literal "--" to the tool, so never put "--" before flags in these commands.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its previous run. Each master push and manual run has a group of its own,
# so none is cancelled and none waits in a queue behind another run (where a newer one would replace it).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  EXPO_NO_TELEMETRY: '1'

jobs:
  checks:
    name: Typecheck, unit tests, lint, admin build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm through corepack (version pinned by packageManager in package.json)
        run: corepack enable && pnpm --version

      - name: Locate the pnpm store
        run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v5
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      - name: API reference is up to date
        run: node scripts/docs/gen-api-reference.mjs --check

      # Informational until the react-reconciler peer (driver app) is resolved.
      - name: Peer dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: pnpm peers check

      # The gates below all run once install succeeds, so one failure does not hide the others.
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck

      - name: Domain unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @naya/domain test

      - name: Demo API scenario tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @naya/demo-api test

      - name: Shared component tests (jest-expo, run through the passenger app)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @naya/passenger test
        env:
          CI: '1'

      - name: Web prototype store tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node --test tests/store.test.mjs
        working-directory: apps/web

      - name: Lint passenger
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @naya/passenger lint

      - name: Lint driver
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @naya/driver lint

      - name: Admin build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @naya/admin build

  e2e:
    name: Playwright e2e (manual)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm through corepack (version pinned by packageManager in package.json)
        run: corepack enable && pnpm --version

      - name: Locate the pnpm store
        run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v5
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm --filter @naya/e2e exec playwright install --with-deps chromium

      # webServer in e2e/playwright.config.ts starts the API (:4010), passenger web (:8081),
      # driver web (:8082) and admin (:5173). Specs run serially against the one shared API.
      - name: Run e2e
        run: pnpm e2e

      - name: Upload Playwright report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore
